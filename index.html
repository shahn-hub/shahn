<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>업무 도구 모음</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #eef2ee;
    --surface: #ffffff;
    --surface-2: #f4f7f3;
    --ink: #182420;
    --ink-soft: #56645a;
    --ink-faint: #7c8a80;
    --line: #d6ded3;
    --line-strong: #b9c5b4;
    --accent: #0f6e52;
    --accent-strong: #0a4f3b;
    --accent-soft: #dcece3;
    --shadow: 0 1px 2px rgba(24,36,32,0.04), 0 6px 20px rgba(24,36,32,0.06);
    --font-display: 'IBM Plex Sans KR', 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
    --font-body: 'IBM Plex Sans KR', 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101812;
      --surface: #172019;
      --surface-2: #1c261e;
      --ink: #e6ece6;
      --ink-soft: #a2b1a4;
      --ink-faint: #77887b;
      --line: #2a362c;
      --line-strong: #3a483b;
      --accent: #4dd39a;
      --accent-strong: #7fe6b8;
      --accent-soft: #17342a;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #101812;
    --surface: #172019;
    --surface-2: #1c261e;
    --ink: #e6ece6;
    --ink-soft: #a2b1a4;
    --ink-faint: #77887b;
    --line: #2a362c;
    --line-strong: #3a483b;
    --accent: #4dd39a;
    --accent-strong: #7fe6b8;
    --accent-soft: #17342a;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body {
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent-soft); color: var(--accent-strong); }

  .page { max-width: 900px; margin: 0 auto; padding: 56px 24px 80px; }

  header {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-bottom: 30px;
    margin-bottom: 30px;
    border-bottom: 1px solid var(--line);
    background:
      repeating-linear-gradient(to bottom, transparent, transparent 27px, var(--line) 27px, var(--line) 28px);
    background-position: 0 46px;
  }
  .eyebrow {
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--accent);
  }
  h1 {
    font-family: var(--font-display);
    font-size: clamp(28px, 4vw, 38px);
    font-weight: 700;
    margin: 0;
    text-wrap: balance;
    letter-spacing: -0.01em;
  }
  header p { margin: 0; color: var(--ink-soft); max-width: 58ch; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 18px;
  }

  a.card {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 22px 22px 20px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    text-decoration: none;
    color: inherit;
    transition: transform 0.12s ease, border-color 0.12s ease;
  }
  a.card:hover { transform: translateY(-2px); border-color: var(--accent); }
  a.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .card .icon {
    width: 40px; height: 40px;
    border-radius: 10px;
    background: var(--accent-soft);
    color: var(--accent-strong);
    display: flex; align-items: center; justify-content: center;
    font-size: 19px;
    flex: none;
  }
  .card h2 {
    font-family: var(--font-display);
    font-size: 16.5px;
    font-weight: 600;
    margin: 0;
  }
  .card p {
    font-size: 13px;
    color: var(--ink-soft);
    margin: 0;
    flex: 1;
  }
  .card .go {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 500;
    color: var(--accent-strong);
    display: flex; align-items: center; gap: 4px;
  }

  .card.placeholder {
    background: transparent;
    border: 1px dashed var(--line-strong);
    box-shadow: none;
    color: var(--ink-faint);
    justify-content: center;
    align-items: center;
    text-align: center;
    min-height: 150px;
    cursor: default;
  }
  .card.placeholder:hover { transform: none; border-color: var(--line-strong); }
  .card.placeholder .icon { background: transparent; color: var(--ink-faint); border: 1px dashed var(--line-strong); }
  .card.placeholder p { font-size: 12.5px; }

  footer {
    margin-top: 40px;
    font-size: 12px;
    color: var(--ink-faint);
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <div class="page">
    <header>
      <span class="eyebrow">대한세무법인 · 내부 업무 도구</span>
      <h1>업무 도구 모음</h1>
      <p>사무실에서 쓰는 내부 변환·업무 도구를 모아둔 페이지입니다. 필요한 도구를 눌러 바로 사용하세요.</p>
    </header>

    <div class="grid">
      <a class="card" href="./sales-voucher-converter.html">
        <span class="icon">🧾</span>
        <h2>매출전표 변환기</h2>
        <p>매출 데이터를 붙여넣으면 더존 Smart A 형식의 매입매출전표·일반전표로 자동 변환합니다.</p>
        <span class="go">열기 →</span>
      </a>

      <div class="card placeholder">
        <span class="icon">＋</span>
        <p>다음 도구가 이 자리에 추가될 예정입니다</p>
      </div>
    </div>

    <footer>새 도구가 필요하면 말씀해 주세요 — 이 메뉴에 계속 추가할 수 있습니다.</footer>
  </div>
</body>
</html>
