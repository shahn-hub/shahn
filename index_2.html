<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>업무 도구 모음</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg-1: #eefaf1;
    --bg-2: #e3f4ea;
    --surface: #ffffff;
    --surface-2: #f2faf5;
    --ink: #24433a;
    --ink-soft: #5c7b6c;
    --ink-faint: #8aa79a;
    --line: #d6ebdd;
    --line-strong: #b8dcc4;
    --accent: #2f9e6e;
    --accent-strong: #1f7a54;
    --accent-soft: #dff3e6;
    --mascot-bg: #d7f0e0;
    --shadow: 0 2px 6px rgba(36,67,58,0.05), 0 10px 28px rgba(36,67,58,0.07);
    --font-display: 'Baloo 2', 'IBM Plex Sans KR', 'Noto Sans KR', sans-serif;
    --font-body: 'IBM Plex Sans KR', 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg-1: #0f1a15;
      --bg-2: #11201a;
      --surface: #17251e;
      --surface-2: #1b2b22;
      --ink: #e3f2e9;
      --ink-soft: #9fc0ad;
      --ink-faint: #6f9080;
      --line: #23392e;
      --line-strong: #2d4a3b;
      --accent: #4fd394;
      --accent-strong: #7fe6b3;
      --accent-soft: #1c3a2c;
      --mascot-bg: #1f3d2f;
      --shadow: 0 2px 6px rgba(0,0,0,0.3), 0 10px 28px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg-1: #0f1a15;
    --bg-2: #11201a;
    --surface: #17251e;
    --surface-2: #1b2b22;
    --ink: #e3f2e9;
    --ink-soft: #9fc0ad;
    --ink-faint: #6f9080;
    --line: #23392e;
    --line-strong: #2d4a3b;
    --accent: #4fd394;
    --accent-strong: #7fe6b3;
    --accent-soft: #1c3a2c;
    --mascot-bg: #1f3d2f;
    --shadow: 0 2px 6px rgba(0,0,0,0.3), 0 10px 28px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 100%);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent-soft); color: var(--accent-strong); }

  .page { max-width: 900px; margin: 0 auto; padding: 56px 24px 80px; }

  header {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 4px 4px 26px 4px;
    margin-bottom: 34px;
  }
  .eyebrow {
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: var(--accent-strong);
  }
  h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(28px, 4.2vw, 40px);
    margin: 0;
    text-wrap: balance;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  header p { margin: 0; color: var(--ink-soft); max-width: 58ch; font-size: 14px; }

  .divider {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--ink-faint);
    font-size: 12.5px;
    font-weight: 600;
    margin-bottom: 18px;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--line-strong);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }

  a.card {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 18px;
    background: var(--surface);
    border-left: 4px solid var(--accent);
    border-radius: 16px;
    box-shadow: var(--shadow);
    text-decoration: none;
    color: inherit;
    transition: transform 0.12s ease;
  }
  a.card:hover { transform: translateY(-2px); }
  a.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .card .icon {
    width: 42px; height: 42px;
    border-radius: 12px;
    background: var(--accent-soft);
    color: var(--accent-strong);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    flex: none;
  }
  .card .txt { flex: 1; min-width: 0; }
  .card h2 {
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 600;
    margin: 0;
    color: var(--ink);
  }
  .card p {
    font-size: 12.5px;
    color: var(--ink-soft);
    margin: 3px 0 0;
  }
  .card .arrow {
    font-size: 16px;
    color: var(--accent-strong);
    flex: none;
  }

  .card.placeholder {
    background: transparent;
    border-left: 4px dashed var(--line-strong);
    box-shadow: none;
    color: var(--ink-faint);
    cursor: default;
  }
  .card.placeholder:hover { transform: none; }
  .card.placeholder .icon { background: transparent; border: 1px dashed var(--line-strong); color: var(--ink-faint); }
  .card.placeholder p { font-size: 12px; }

  footer {
    margin-top: 36px;
    font-size: 12px;
    color: var(--ink-faint);
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <div class="page">
    <header>
      <h1>도비야, 일하자</h1>
      <p>사무실에서 쓰는 내부 변환·업무 도구를 모아둔 페이지입니다. 필요한 도구를 눌러 바로 사용하세요.</p>
    </header>

    <div class="divider" style="margin-top: 48px;">파일 목록</div>

    <div class="grid">
      <a class="card" href="./sales-voucher-converter.html">
        <span class="icon">🧾</span>
        <span class="txt">
          <h2>매출전표 변환기</h2>
          <p>매출 엑셀을 매입매출전표·일반전표 양식으로 자동 변환해요</p>
        </span>
        <span class="arrow">→</span>
      </a>

      <div class="card placeholder">
        <span class="icon">＋</span>
        <span class="txt">
          <h2 style="color:var(--ink-faint); font-weight:500;">다음 도구</h2>
          <p>추가될 예정이에요</p>
        </span>
      </div>
    </div>

    <footer>새 도구가 필요하면 말씀해 주세요 — 이 메뉴에 계속 추가할 수 있습니다.</footer>
  </div>
</body>
</html>
